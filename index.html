<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CRUD de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: #f4f6f8;
        }
        .card {
            border: none;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        .table thead th {
            white-space: nowrap;
        }
    </style>
</head>
<body>
    <div class="container py-4">
        <h1 class="mb-4 text-center">CRUD Simples de Produtos</h1>

        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <strong id="formTitle">Cadastrar Produto</strong>
            </div>
            <div class="card-body">
                <form id="productForm" class="row g-3">
                    <input type="hidden" id="productId" />
                    <div class="col-md-4">
                        <label for="nome" class="form-label">Nome</label>
                        <input type="text" class="form-control" id="nome" required />
                    </div>
                    <div class="col-md-3">
                        <label for="categoria" class="form-label">Categoria</label>
                        <input type="text" class="form-control" id="categoria" required />
                    </div>
                    <div class="col-md-2">
                        <label for="preco" class="form-label">Preço (R$)</label>
                        <input type="number" class="form-control" id="preco" min="0" step="0.01" required />
                    </div>
                    <div class="col-md-2">
                        <label for="estoque" class="form-label">Estoque</label>
                        <input type="number" class="form-control" id="estoque" min="0" step="1" required />
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-success w-100" id="saveButton">Salvar</button>
                    </div>
                    <div class="col-12 text-end">
                        <button type="button" class="btn btn-outline-secondary d-none" id="cancelEdit">Cancelar edição</button>
                    </div>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <strong>Produtos Cadastrados</strong>
                <input type="text" class="form-control w-auto" id="searchInput" placeholder="Buscar por nome/categoria" />
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-striped mb-0" id="productsTable">
                        <thead class="table-light">
                            <tr>
                                <th>Nome</th>
                                <th>Categoria</th>
                                <th>Preço</th>
                                <th>Estoque</th>
                                <th class="text-center">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="productsBody">
                            <tr>
                                <td colspan="5" class="text-center py-4">Nenhum produto cadastrado.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer" id="stats">Total de produtos: 0</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
